<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 10 English – Connectors Quiz</title>
<style>
  *{box-sizing:border-box}
  body{font-family:Arial,sans-serif;background:#f2f6ff;color:#24324a;margin:0;padding:18px}
  .container{max-width:850px;margin:20px auto;background:white;padding:24px;border-radius:16px;box-shadow:0 5px 22px #1b3b6b18}
  h1{color:#234b91;margin-top:0}
  .intro{color:#52627a;line-height:1.5}
  label{display:block;font-weight:bold;margin:14px 0 6px}
  input[type=text],input[type=number]{width:100%;padding:12px;border:1px solid #bdc9dc;border-radius:8px;font-size:16px}
  .question{padding:15px;margin:14px 0;background:#f7f9fd;border:1px solid #e1e8f3;border-radius:10px}
  .question p{margin:0 0 10px;font-weight:bold}
  .option{display:block;font-weight:normal;margin:8px 0;line-height:1.4}
  button{background:#2457a6;color:white;border:0;padding:13px 20px;border-radius:9px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:14px}
  button:disabled{opacity:.5}
  #timer{font-weight:bold;color:#b42318;font-size:19px}
  #result{margin-top:20px;padding:16px;background:#eef7ef;border-radius:10px;display:none}
  .correct{color:#16733b}.wrong{color:#b42318}
  .review-item{padding:10px 0;border-bottom:1px solid #d9e2ee}
  .small{font-size:13px;color:#65738a}
</style>
</head>
<body>
<div class="container">
  <h1>Grade 10 English – Connectors Quiz</h1>
  <p class="intro">Choose the best connector to complete each sentence. You have <strong>5 minutes</strong> to answer 20 questions.</p>

  <form id="quizForm">
    <label for="studentName">Student name</label>
    <input id="studentName" name="Student name" type="text" required placeholder="Enter your full name">
    <label for="grade">Grade</label>
    <input id="grade" name="Grade" type="text" required placeholder="e.g. 10 A">
    <p>Time remaining: <span id="timer">05:00</span></p>
    <div id="questions"></div>
    <button id="submitBtn" type="submit">Submit answers</button>
  </form>

  <div id="result" aria-live="polite"></div>
  <p class="small">Your result is sent to your teacher by email after the form has been activated.</p>
</div>
<script>
const questions = [
 {q:"1. It was raining heavily; _____, the match continued.",o:["however","because","until","unless"],a:0,e:"However shows contrast."},
 {q:"2. _____ she was tired, she finished her homework.",o:["Despite","Although","Because of","Until"],a:1,e:"Although is followed by a clause."},
 {q:"3. _____ the bad weather, the trip was enjoyable.",o:["Although","Despite","However","Unless"],a:1,e:"Despite is followed by a noun phrase."},
 {q:"4. He is poor, _____ he is honest.",o:["yet","because","until","so that"],a:0,e:"Yet expresses contrast."},
 {q:"5. You cannot enter _____ you have a ticket.",o:["while","unless","although","despite"],a:1,e:"Unless means if not."},
 {q:"6. Wait here _____ I return.",o:["until","despite","however","although"],a:0,e:"Until indicates up to a time."},
 {q:"7. I was cooking _____ my sister was studying.",o:["unless","while","despite","yet"],a:1,e:"While connects two actions happening at the same time."},
 {q:"8. Call me _____ you reach home.",o:["when","despite","however","unless"],a:0,e:"When refers to the time something happens."},
 {q:"9. _____ being young, she is very responsible.",o:["Although","Despite","However","Unless"],a:1,e:"Despite is followed by a gerund phrase."},
 {q:"10. He studied hard. _____, he did not pass the examination.",o:["Therefore","However","Because","Until"],a:1,e:"However introduces a contrasting idea."},
 {q:"11. The road was closed _____ an accident.",o:["because of","although","yet","while"],a:0,e:"Because of is followed by a noun phrase."},
 {q:"12. _____ you practise regularly, you will improve.",o:["If","Despite","However","Until"],a:0,e:"If introduces a condition."},
 {q:"13. She took an umbrella _____ it was raining.",o:["because","although","unless","yet"],a:0,e:"Because gives a reason."},
 {q:"14. He is friendly _____ his brother is rather quiet.",o:["while","until","despite","unless"],a:0,e:"While can show a contrast between two facts."},
 {q:"15. The team played well _____ they lost the game.",o:["because","although","until","unless"],a:1,e:"Although introduces an unexpected contrast."},
 {q:"16. You must finish your work _____ you go outside.",o:["before","despite","however","yet"],a:0,e:"Before indicates that one action happens earlier."},
 {q:"17. _____ the heavy traffic, we arrived on time.",o:["In spite of","Although","Because","Unless"],a:0,e:"In spite of is followed by a noun phrase."},
 {q:"18. She saved money _____ she could buy a bicycle.",o:["so that","although","despite","while"],a:0,e:"So that expresses purpose."},
 {q:"19. The teacher was absent; _____, the lesson was conducted by another teacher.",o:["therefore","although","unless","despite"],a:0,e:"Therefore shows a result."},
 {q:"20. He continued working _____ he was feeling unwell.",o:["even though","because of","until","so"],a:0,e:"Even though introduces a contrasting fact."}
];
const form=document.getElementById('quizForm');
const holder=document.getElementById('questions');
questions.forEach((item,i)=>{
 const div=document.createElement('div'); div.className='question';
 const p=document.createElement('p'); p.textContent=item.q; div.appendChild(p);
 item.o.forEach((option,j)=>{
   const lab=document.createElement('label'); lab.className='option';
   const radio=document.createElement('input'); radio.type='radio'; radio.name='q'+i; radio.value=j; radio.required=true;
   lab.appendChild(radio); lab.append(' '+option); div.appendChild(lab);
 });
 holder.appendChild(div);
});
let remaining=300, submitted=false;
const timer=document.getElementById('timer');
const interval=setInterval(()=>{
 if(submitted)return;
 remaining--;
 const m=String(Math.floor(remaining/60)).padStart(2,'0');
 const s=String(remaining%60).padStart(2,'0');
 timer.textContent=m+':'+s;
 if(remaining<=0){clearInterval(interval);form.requestSubmit();}
},1000);

form.addEventListener('submit', async (event)=>{
 event.preventDefault();
 if(submitted)return;
 if(!form.reportValidity())return;
 submitted=true; clearInterval(interval);
 document.getElementById('submitBtn').disabled=true;
 let score=0, details=[];
 questions.forEach((item,i)=>{
   const selected=form.querySelector('input[name="q'+i+'"]:checked');
   const chosen=selected?Number(selected.value):-1;
   const ok=chosen===item.a; if(ok)score++;
   details.push((i+1)+'. '+item.q+'\nStudent answer: '+(chosen>=0?item.o[chosen]:'Not answered')+'\nCorrect answer: '+item.o[item.a]+'\n'+(ok?'Correct':'Incorrect')+' — '+item.e);
 });
 const name=document.getElementById('studentName').value.trim();
 const grade=document.getElementById('grade').value.trim();
 const percent=Math.round(score/questions.length*100);
 const report='Student: '+name+'\nGrade: '+grade+'\nScore: '+score+'/20 ('+percent+'%)\n\n'+details.join('\n\n');
 const result=document.getElementById('result');
 result.style.display='block';
 result.innerHTML='<h2>Quiz result</h2><p><strong>'+score+' / 20 ('+percent+'%)</strong></p><h3>Answer review</h3>'+details.map((d,i)=>'<div class="review-item"><strong>'+questions[i].q+'</strong><br>Your answer: '+(form.querySelector('input[name="q'+i+'"]:checked')?questions[i].o[Number(form.querySelector('input[name="q'+i+'"]:checked').value)]:'Not answered')+'<br>Correct answer: <span class="correct">'+questions[i].o[questions[i].a]+'</span><br><span class="'+(form.querySelector('input[name="q'+i+'"]:checked')&&Number(form.querySelector('input[name="q'+i+'"]:checked').value)===questions[i].a?'correct':'wrong')+'">'+questions[i].e+'</span></div>').join('');
 result.scrollIntoView({behavior:'smooth'});
 const data=new FormData();
 data.append('_subject','Grade 10 Connectors Quiz Result');
 data.append('_template','table');
 data.append('_captcha','false');
 data.append('Student name',name);
 data.append('Grade',grade);
 data.append('Score',score+'/20');
 data.append('Percentage',percent+'%');
 data.append('Full answers and review',report);
 try{
   const response=await fetch('https://formsubmit.co/ajax/sahasrarajaguru2000@gmail.com',{method:'POST',body:data,headers:{'Accept':'application/json'}});
   if(response.ok){
     const info=await response.json();
     const note=document.createElement('p'); note.textContent='Your result has been submitted for email delivery.'; result.appendChild(note);
   } else {
     const note=document.createElement('p'); note.textContent='Your score is shown above, but the email could not be sent. Please tell your teacher.'; result.appendChild(note);
   }
 }catch(err){
   const note=document.createElement('p'); note.textContent='Your score is shown above, but email delivery could not be confirmed. Please tell your teacher.'; result.appendChild(note);
 }
});
</script>
</body>
</html>
